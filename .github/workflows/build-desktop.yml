name: Build Native Desktop App (.exe / .dmg / .AppImage)

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build production game assets
        run: npm run build

      - name: Install desktop packager (without altering repo lockfile)
        run: npm install --no-save electron@35 electron-builder@25

      - name: Package native executable
        run: npx electron-builder --config electron-builder.json --${{ matrix.platform }} --publish never

      - name: Upload desktop binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: operation-ironclad-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release with downloadable executables
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Operation Ironclad — Desktop Builds (.exe / .dmg / .AppImage)
          draft: false
          prerelease: false
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
